<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1140" viewBox="0 0 1500 1140">
<title>04  Window navigation</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#000000"/></marker></defs>
<rect x="0" y="0" width="1500" height="1140" rx="0" fill="#ffffff" stroke="#ffffff"/>
<text x="36" y="64" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#000000">04  Window navigation</text>
<text x="36" y="91" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#000000">Solid arrows show available actions; guards determine when transitions are permitted. S07 is a panel within S06.</text>
<polyline points="540,197 225,197 225,325" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
