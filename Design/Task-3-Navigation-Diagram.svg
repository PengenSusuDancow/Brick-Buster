<text x="833" y="436" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#000000">Save / cancel*</text>
<polyline points="1070,710 1010,710 1010,475 895,475 895,406" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="1085" y="747" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#000000">Confirm / cancel</text>
<polyline points="225,738 225,960" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="238" y="857" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#000000">Use as target [selected]</text>
