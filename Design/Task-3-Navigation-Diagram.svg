<text x="253" y="486" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#000000">Add set [ready]</text>
<polyline points="730,406 730,635" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="742" y="555" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#000000">Update selected</text>
<polyline points="920,383 1035,383 1035,550 1250,550 1250,635" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="1110" y="534" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#000000">Remove selected</text>
<polyline points="400,692 540,692" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
