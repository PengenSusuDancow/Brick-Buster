<polyline points="920,197 1245,197 1245,325" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="1030" y="182" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#000000">Piece query [ready]</text>
