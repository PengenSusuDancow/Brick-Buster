<text x="1202" y="1208" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#000000">+ name: str; color: str?</text>
<text x="1202" y="1231" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#000000">+ required: int; available: int</text>
<text x="1202" y="1254" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#000000">+ missing: int</text>
