<text x="72" y="1155" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000">Errors and result status</text>
<text x="72" y="1189" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#000000">DataError: missing / invalid inventory data.</text>
<text x="72" y="1212" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#000000">ValidationError: invalid collection input.</text>
<text x="72" y="1235" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#000000">BuildStatus: BUILDABLE / NOT_BUILDABLE.</text>
<text x="72" y="1258" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#000000">A failed check raises an error; no result.</text>
